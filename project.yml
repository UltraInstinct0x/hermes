name: Hermes
options:
  # Fork (UltraInstinct0x): own team and bundle prefix so it installs beside the official app.
  bundleIdPrefix: dev.supersaiyan
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  configs:
    # Hermes Neo (UltraInstinct0x fork): one identity for Debug and Release, so a build from Xcode and
    # one from the command line are the same app on the phone. Only the push environment differs.
    Debug:
      HERMES_APS_ENVIRONMENT: development
      HERMES_APP_BUNDLE_ID: dev.supersaiyan.hermesneo
      HERMES_APP_GROUP: group.dev.supersaiyan.hermesneo
      HERMES_KEYCHAIN_GROUP: dev.supersaiyan.hermesneo.push
    Release:
      HERMES_APS_ENVIRONMENT: production
      HERMES_APP_BUNDLE_ID: dev.supersaiyan.hermesneo
      HERMES_APP_GROUP: group.dev.supersaiyan.hermesneo
      HERMES_KEYCHAIN_GROUP: dev.supersaiyan.hermesneo.push
  base:
    # The shared Keychain group's team prefix (the App ID prefix is the team id).
    HERMES_KEYCHAIN_PREFIX: GM3SRSD642.
    # The Mac app doesn't use the App Group (local notifications only; see docs).
    "HERMES_APP_GROUP[sdk=macosx*]": ""
    # One version for the app and its extensions (App Store validation requires they match).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: GM3SRSD642
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  HermesKit:
    path: Packages/HermesKit
  # Hermes Neo: the owner's box (pairing, calls from bots), ported from the Hermes Bot app.
  HermesBox:
    path: Packages/HermesBox
  # Hermes Neo: the bots' animated avatar (bloub), vendored from Hermes Bot (Packages/HermesAvatar/VENDORED.md).
  HermesAvatar:
    path: Packages/HermesAvatar
  # Hermes Neo: the box's Live Activity types, shared by the app and the widget extension.
  HermesActivityKit:
    path: Packages/HermesActivityKit
  # Mac-only support (Sparkle), linked only into macOS builds.
  HermesMacSupport:
    path: Packages/HermesMacSupport
  # Talk's Realtime engine (docs/voice.md §4.1): Google's WebRTC, the build stasel/WebRTC publishes.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 155.0.0

targets:
  Hermes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # Push notifications (docs/notifications.md): the app's push layer, and code it shares with the widget.
      - path: Push/App
        excludes: ["*.plist", "*.entitlements"]
      - path: Push/Shared
      # Hermes Neo: the Lock Screen buttons of the box's Live Activities (run in the app's process).
      - path: Neo/Shared
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesPush
      - package: HermesKit
        product: HermesMarkdown
      - package: HermesBox
        product: HermesBox
        destinationFilters: [iOS]
      - package: HermesAvatar
        product: HermesAvatarUI
        destinationFilters: [iOS]
      - package: HermesActivityKit
        product: HermesActivityKit
        destinationFilters: [iOS]
      - target: HermesNotificationService
        destinationFilters: [iOS]
      - target: HermesNotificationContent
        destinationFilters: [iOS]
      - target: HermesWidgets
        destinationFilters: [iOS]
      - target: HermesWatch
        destinationFilters: [iOS]
      - package: HermesMacSupport
        product: HermesMacSupport
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        # Xcode Cloud uses the app target's explicit bundle ID to match its App Store Connect record.
        PRODUCT_BUNDLE_IDENTIFIER: dev.supersaiyan.hermesneo
        PRODUCT_NAME: Hermes
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Push/App/Hermes-iOS.entitlements
        # Plugins hidden from Suggested sync through iCloud key-value storage where the build carries
        # its entitlement (docs/plugins.md §9.3): iPhone and iPad always, the Mac in Release only
        # (below). Info.plist's HermesICloudKeyValueSync says which, so it must match the entitlement.
        HERMES_ICLOUD_KEY_VALUE_SYNC: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERMES_PUSH"
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Neo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Caffeinated Code"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Hermes connects to Hermes Agent gateways running on your local network."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos to share with Hermes and scan pairing codes to connect."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate messages and talk with Hermes in Voice mode. What you say is turned into text on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn what you say into text on this device, for dictation and Voice mode."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Confirm it’s you before approving a payment or anything that can’t be undone."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save pictures Hermes sends you to Photos."
        # hermesapp://connect links (pairing QR codes). Debug uses its own scheme so it never
        # takes links meant for the real app.
        HERMES_URL_SCHEME: hermesapp
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsMultipleScenes[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphone*]": UIStatusBarStyleDefault
        ENABLE_PREVIEWS: YES
        # The Mac app ships as a notarized Developer ID DMG with Sparkle (not the Mac App Store):
        # Hardened Runtime is required for notarization; no App Sandbox, so Sparkle installs updates
        # in place without XPC installer exceptions. iOS and iPadOS go to TestFlight / the App Store.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        # Dictation and Voice mode on the Mac (Hardened Runtime gates the microphone).
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        # Sparkle (macOS only; iOS ignores these keys). SUPublicEDKey pairs with the appcast-signing
        # private key kept in Infisical — never rotate it: shipped apps only trust this public key.
        # Values land in App/Resources/Info.plist (SUFeedURL, SUPublicEDKey).
        HERMES_APPCAST_URL: ""
        HERMES_SPARKLE_PUBLIC_KEY: ""
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]": "$(inherited) @executable_path/Frameworks"
      configs:
        # Debug builds are a separate app ("Hermes Dev"): own bundle id, Keychain items,
        # settings and icon, and the only builds that can bootstrap the demo gateway.
        # Release (TestFlight / App Store) is the real "Hermes" and never touches demo data.
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: Hermes Neo
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          HERMES_URL_SCHEME: hermesapp-dev
          # A Mac Debug build with the iCloud entitlement would need a development profile, which only
          # a developer portal write makes, so it keeps hidden plugins on this Mac.
          "HERMES_ICLOUD_KEY_VALUE_SYNC[sdk=macosx*]": NO
        Release:
          INFOPLIST_KEY_CFBundleDisplayName: Hermes Neo
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          # Neo's iOS archive uses automatic signing for Xcode Cloud. Mac releases still use
          # the Developer ID profile, which carries the iCloud key-value entitlement.
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Push/App/Hermes-macOS.entitlements
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Developer ID Application
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": Hermes Developer ID
          # Mac updates: the appcast rides along with each GitHub release; the EdDSA public key
          # pairs with Infisical prod /hermes/ci/SPARKLE_ED_PRIVATE_KEY (never rotate).
          HERMES_APPCAST_URL: https://github.com/vburojevic/hermes-releases/releases/latest/download/appcast.xml
          HERMES_SPARKLE_PUBLIC_KEY: IUPLRKpg3gIVLpvG7a59SUTYCB6j707Jwmk9oYNlP4c=

  HermesWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: HermesKit
        product: HermesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(HERMES_APP_BUNDLE_ID)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HermesWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [WatchUITests]
    dependencies:
      - target: HermesWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.caffeinatedcode.hermes.watchuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesWatch
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  HermesNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Push/NotificationService
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: HermesKit
        product: HermesPush
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).NotificationService
        PRODUCT_NAME: HermesNotificationService
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/NotificationService/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Notifications
        CODE_SIGN_ENTITLEMENTS: Push/NotificationService/NotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  HermesNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: Push/NotificationContent
        excludes: ["*.plist", "*.entitlements"]
      - path: Push/Extensions
      - path: App/Design/Palette.swift
      - path: App/Design/HermesMarkPath.swift
    dependencies:
      - package: HermesKit
        product: HermesPush
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).NotificationContent
        PRODUCT_NAME: HermesNotificationContent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/NotificationContent/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Requests
        CODE_SIGN_ENTITLEMENTS: Push/NotificationContent/NotificationContent.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  HermesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Push/Widgets
        excludes: ["*.plist", "*.entitlements"]
      - path: Push/Shared
      - path: Push/Extensions
      - path: App/Design/Palette.swift
      - path: App/Design/HermesMarkPath.swift
      # Hermes Neo: the box's Live Activities and their buttons.
      - path: Neo/Activities
      - path: Neo/Shared
    dependencies:
      - package: HermesKit
        product: HermesPush
      - package: HermesActivityKit
        product: HermesActivityKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).Widgets
        PRODUCT_NAME: HermesWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Push/Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        CODE_SIGN_ENTITLEMENTS: Push/Widgets/Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERMES_WIDGET"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # UI tests against the mock gateway (docs/development.md): start Tools/mock-hermes/backend.py first.
  HermesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Info.plist]
    dependencies:
      - target: Hermes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: UITests/Info.plist
        TEST_TARGET_NAME: Hermes
        # Where the mock runs; override on the command line (HERMES_MOCK_GATEWAY=…).
        HERMES_MOCK_GATEWAY: http://127.0.0.1:18642
        HERMES_MOCK_BACKEND: http://127.0.0.1:19119
        # The spoken clips the simulated microphone plays (`-HERMES_VOICE_INPUT`).
        HERMES_VOICE_CLIPS: $(SRCROOT)/Tools/mock-hermes/voice
        # Seconds the app's audio engine waits before its first start (`-HERMES_ENGINE_START_DELAY`),
        # as on a busy Mac; empty for none.
        HERMES_ENGINE_START_DELAY: ""
        # XCTestCase's initialisers aren't main-actor; the tests mark what drives the UI.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  HermesWatch:
    build:
      targets:
        HermesWatch: all
        HermesWatchUITests: [test]
    test:
      config: Debug
      targets: [HermesWatchUITests]
  HermesUITests:
    build:
      targets:
        Hermes: all
        HermesUITests: [test]
    test:
      config: Debug
      targets:
        - HermesUITests
  Hermes:
    build:
      targets:
        Hermes: all
    run:
      config: Debug
    archive:
      config: Release
